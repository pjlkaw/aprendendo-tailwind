<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Tailwind</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="bg-white">
    <section class="h-screen w-screen grid grid-cols-2 grid-rows-6">
        <div class="row-span-5 flex justify-end">
            <img class="w-96" src="./assets/celularInstagram.png" alt="">
        </div>

        <main class="row-span-5 flex justify-center items-center flex-col grid-cols-1">
            <form class="w-80 flex flex-col justify-center items-center border rounded-sm px-10 py-4 gap-5">
                <img class="w-52" src="./assets/insta-logo.png" alt="">
                <input type="text" placeholder="Número de telefone, usuário, e-mail">
                <input type="text" placeholder="Senha">
                <button>Entrar</button>
                
                <a href="#">Logar com Facebook</a>
                <a href="#">Esqueci minha senha</a>
            </form>
            <div>
                <p>Não tem conta? Cadastrar-se</p>
            </div>
            <p>Baixe o Aplicativo</p>

            <div>
                <img class="h-10" src="./assets/google.png" alt="">
                <img class="h-10" src="./assets/appStore.png" alt="">
            </div>
        </main>

        <footer class="row-span-1">
                <ul>
                    <li>Meta</li>
                    <li>About</li>
                    <li>Blog</li>
                    <li>Jobs</li>
                    <li>Help</li>
                    <li>API</li>
                    <li>Privacy</li>
                    <li>terms</li>
                    <li>Locations</li>
                    <li>Instagram Lite</li>
                    <li>Threads</li>
                    <li>Contact uploading and non-users</li>
                    <li>Meta verified</li>
                </ul>
                <ul>
                    <li></li>
                    <li>2025 &copy; Instagram from Meta</li>
                </ul>
        </footer>


    </section>
</html>
